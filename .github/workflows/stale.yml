name: stale

on:
    schedule:
        - cron: "31 22 * * *" # Runs every day at 10:31 PM UTC

permissions:
    issues: write
    pull-requests: write

jobs:
    stale:
        uses: eslint/workflows/.github/workflows/stale.yml@d533003faa62d8d06f2fef67cb5afbe75d643dfd # main
        secrets:
            token: ${{ secrets.GITHUB_TOKEN }}
