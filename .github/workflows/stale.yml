name: stale

on:
    schedule:
        - cron: "31 22 * * *" # Runs every day at 10:31 PM UTC

permissions:
    issues: write
    pull-requests: write

jobs:
    stale:
        uses: eslint/workflows/.github/workflows/stale.yml@45216eddf520165b268c91f3c55a91eb6cec19dd # main
        secrets:
            token: ${{ secrets.GITHUB_TOKEN }}
